name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - name: no runtime dependencies
        run: node -e 'const p=require("./package.json"); if (p.dependencies||p.peerDependencies||p.optionalDependencies) { console.error("runtime dependencies are not allowed"); process.exit(1) }'
